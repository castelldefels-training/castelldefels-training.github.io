<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UE Castelldefels · Training League</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#112446;font:16px system-ui}header{background:#112446;color:#fff;padding:20px;border-bottom:6px solid #ffd32a}main{max-width:950px;margin:auto;padding:15px}section{background:white;border-radius:12px;padding:18px;margin:12px 0}button,input,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #c7d0df;margin:4px}button{background:#ffd32a;color:#112446;font-weight:700;cursor:pointer}button.secondary{background:#e8edf5}button:disabled{opacity:.5}h2{margin-top:0}label{display:inline-block;padding:8px}input[type=checkbox]{width:20px;height:20px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.team{border-left:7px solid #ffd32a;padding:12px;margin:10px 0;background:#f4f6fa}.muted{color:#52647b}#msg{white-space:pre-wrap;color:#963800}nav{display:flex;flex-wrap:wrap} .score{font-size:28px;font-weight:bold}</style><header><b>UE CASTELLDEFELS</b><div>TRAINING LEAGUE · Cuerpo técnico</div></header><main><div id="msg"></div><div id="app">Cargando…</div></main><script type="module">

const $=id=>document.getElementById(id), app=$('app'), msg=$('msg'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); let user,players=[],d,view='home',timer=null,remaining=0;const uid=()=>crypto.randomUUID(), date=()=>new Date().toLocaleDateString('en-CA');
const key=()=> 'ue-training-draft-'+user.id;function save(){localStorage.setItem(key(),JSON.stringify(d))}function fail(e){msg.textContent=e.message||String(e)}async function q(x){let r=await x;if(r.error)throw r.error;return r.data}function fresh(){return {id:uid(),date:new Date().toISOString().slice(0,10),title:'Entrenamiento',present:players.map(p=>p.id),tasks:[],current:0}}const name=id=>players.find(p=>p.id===id)?.full_name||'Jugador';function btn(t,a,cl=''){return `<button class="${cl}" data-act="${a}">${t}</button>`}function rank(tasks){let r={};for(let t of tasks){let scores=t.teams.filter(x=>x.kind==='team').map(x=>[x.id,t.events.filter(e=>e.team_id===x.id&&['goal','point'].includes(e.event_type)).reduce((a,e)=>a+e.value,0)]);let max=Math.max(...scores.map(x=>x[1]));let winners=scores.filter(x=>x[1]===max).length;for(let x of t.teams){for(let id of x.members){let z=r[id]??={id,pts:0,g1:0,g2:0,ass:0,bonus:0};let s=scores.find(y=>y[0]===x.id);if(t.type!=='individual'&&s&&scores.length>1)z.pts+=s[1]===max?(winners>1?t.draw:t.win):t.loss;for(let e of t.events.filter(e=>e.player_id===id)){if(e.event_type==='goal')z[e.value===2?'g2':'g1']++;if(e.event_type==='assist')z.ass+=e.value;if(e.event_type==='bonus'||(t.type==='individual'&&['goal','point'].includes(e.event_type))){z.pts+=e.value;z.bonus+=e.value}}}}}return Object.values(r).sort((a,b)=>b.pts-a.pts||name(a.id).localeCompare(name(b.id)))}function table(r){return `<table><tr><th>#</th><th>Jugador</th><th>Pts</th><th>G1</th><th>G2</th><th>Asist.</th></tr>${r.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(name(p.id))}</td><td><b>${p.pts}</b></td><td>${p.g1}</td><td>${p.g2}</td><td>${p.ass}</td></tr>`).join('')}</table>`}function render(){if(!user){app.innerHTML=`<section><h2>Acceso privado</h2><form id="login"><input type="email" id="email" placeholder="Correo" required><input type="password" id="password" placeholder="Contraseña" required><button>Entrar</button></form></section>`;return}let t=d.tasks[d.current];app.innerHTML=`<nav>${btn('Entrenamiento','home')}${btn('En directo','live')}${btn('Ranking','rank')}${btn('Plantilla','players')}${btn('Histórico','history')}${btn('Salir','logout','secondary')}</nav><p class="muted">${navigator.onLine?'Con conexión':'Sin conexión'} · Borrador guardado en este dispositivo</p>`;if(view==='home')app.innerHTML+=`<section><h2>Nuevo entrenamiento</h2><input id="date" type="date" value="${esc(d.date)}"><input id="title" value="${esc(d.title)}"><h3>Asistencia (${d.present.length})</h3>${players.map(p=>`<label><input type="checkbox" data-player="${p.id}" ${d.present.includes(p.id)?'checked':''}>${esc(p.full_name)}</label>`).join('')}<h3>Tareas</h3>${d.tasks.map((x,i)=>`<p>${i+1}. ${esc(x.name)} · ${x.duration} min ${btn('Abrir','task:'+i)}</p>`).join('')}<input id="taskname" placeholder="Nombre de la tarea"><input id="duration" type="number" min="1" value="10" style="width:85px"><select id="type"><option value="collective">Colectiva</option><option value="individual">Individual</option><option value="mixed">Mixta</option></select>${btn('Añadir tarea','add')}</section>`;if(view==='live')app.innerHTML+=!t?'<section>Añade una tarea primero.</section>':`<section><h2>${esc(t.name)}</h2>${d.tasks.map((x,i)=>btn(String(i+1),'task:'+i,'secondary')).join('')}<p class="score" id="clock">${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</p>${btn('Iniciar / Pausar','timer')}${btn('Reiniciar reloj','reset')}${btn('Deshacer última acción','undo','secondary')}<h3>Equipos</h3><input id="teamname" placeholder="Nombre"><select id="color">${['Amarillo','Azul','Rojo','Verde','Blanco','Sin peto'].map(c=>`<option>${c}</option>`).join('')}</select><select id="kind"><option value="team">Equipo</option><option value="joker">Comodines</option><option value="group">Grupo individual</option></select>${btn('Añadir equipo','team')}${btn('Repartir aleatoriamente','random')}<p><label>Victoria <input id="win" type="number" value="${t.win}" style="width:70px"></label><label>Empate <input id="draw" type="number" value="${t.draw}" style="width:70px"></label><label>Derrota <input id="loss" type="number" value="${t.loss}" style="width:70px"></label></p>${t.teams.map(x=>`<div class="team"><b>${esc(x.name)} · ${esc(x.color)}</b><div class="score">${t.events.filter(e=>e.team_id===x.id&&['goal','point'].includes(e.event_type)).reduce((s,e)=>s+e.value,0)}</div>${btn('Gol +1','event:'+x.id+':goal:1')}${btn('Gol +2','event:'+x.id+':goal:2')}${btn('Punto +1','event:'+x.id+':point:1')}<div>${d.present.map(id=>`<label><input type="checkbox" data-team="${x.id}" data-member="${id}" ${x.members.includes(id)?'checked':''}>${esc(name(id))}</label>`).join('')}</div><select id="p-${x.id}"><option value="">Elige jugador</option>${x.members.map(id=>`<option value="${id}">${esc(name(id))}</option>`).join('')}</select>${['goal','point','assist','bonus'].map((e,i)=>[1,2].map(v=>btn(['Gol','Punto','Asistencia','Bonus'][i]+' +'+v,`player:${x.id}:${e}:${v}`)).join('')).join('')}</div>`).join('')}${btn('Ver ranking','rank')}</section>`;if(view==='rank')app.innerHTML+=`<section><h2>Clasificación del entrenamiento</h2>${table(rank(d.tasks))}${btn('Compartir WhatsApp','share')}${btn('Guardar y finalizar en Supabase','finish')}</section>`;if(view==='players')app.innerHTML+=`<section><h2>Plantilla (${players.length})</h2>${players.map(p=>`<p>${esc(p.full_name)}</p>`).join('')}</section>`;if(view==='history')app.innerHTML+='<section id="history">Cargando histórico…</section>';}
async function init(u){user=u;if(!u){render();return}players=await q(db.from('players').select('id,full_name,active').eq('active',true).order('full_name'));if(!players.length)throw Error('No hay jugadores accesibles para esta cuenta.');try{d=JSON.parse(localStorage.getItem(key()))||fresh()}catch{d=fresh()}render()}
app.addEventListener('submit',async e=>{e.preventDefault();try{let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await init(r.data.user)}catch(e){fail(e)}});app.addEventListener('change',e=>{if(!d)return;let a=e.target,t=d.tasks[d.current];if(a.id==='date'||a.id==='title')d[a.id]=a.value;if(a.dataset.player){let id=a.dataset.player;d.present=a.checked?[...new Set([...d.present,id])]:d.present.filter(x=>x!==id)}if(a.dataset.team){let x=t.teams.find(x=>x.id===a.dataset.team),id=a.dataset.member;if(a.checked){for(let y of t.teams)y.members=y.members.filter(i=>i!==id);x.members.push(id)}else x.members=x.members.filter(i=>i!==id);save();render();return}if(['win','draw','loss'].includes(a.id))t[a.id]=Number(a.value);save()});
app.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let [a,id,typ,val]=b.dataset.act.split(':'),t=d?.tasks[d.current];msg.textContent='';try{if(['home','live','rank','players','history'].includes(a)){view=a;render();if(a==='history'){let s=await q(db.from('sessions').select('id,session_date,title,status').order('session_date',{ascending:false}));$('history').innerHTML='<h2>Histórico</h2>'+s.map(x=>`<p>${esc(x.session_date)} · ${esc(x.title)} · ${esc(x.status)}</p>`).join('')}return}if(a==='logout'){await db.auth.signOut();user=null;render();return}if(a==='add'){let n=$('taskname').value.trim(),m=Number($('duration').value);if(!n||m<1)throw Error('Indica nombre y duración.');d.tasks.push({id:uid(),name:n,duration:m,type:$('type').value,win:3,draw:1,loss:0,teams:[],events:[]});d.current=d.tasks.length-1;remaining=m*60}if(a==='task'){clearInterval(timer);timer=null;d.current=Number(id);remaining=d.tasks[d.current].duration*60;view='live'}if(a==='team'){let kind=$('kind').value,color=$('color').value;t.teams.push({id:uid(),name:$('teamname').value.trim()||color,color,kind,members:[]})}if(a==='random'){let ts=t.teams.filter(x=>x.kind==='team');if(!ts.length)throw Error('Crea equipos primero.');if(t.events.length)throw Error('No se puede repartir después de registrar acciones.');t.teams.forEach(x=>x.members=[]);let p=[...d.present];for(let i=p.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}p.forEach((x,i)=>ts[i%ts.length].members.push(x))}if(a==='event'||a==='player'){let p=a==='player'?$(`p-${id}`).value:null;if(a==='player'&&!p)throw Error('Selecciona un jugador.');t.events.push({id:uid(),team_id:id,player_id:p,event_type:typ,value:Number(val),created_at:new Date().toISOString()})}if(a==='undo')t.events.pop();if(a==='timer'){if(timer){clearInterval(timer);timer=null}else{if(!remaining)remaining=t.duration*60;timer=setInterval(()=>{remaining=Math.max(0,remaining-1);if($('clock'))$('clock').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(!remaining){clearInterval(timer);timer=null}},1000)} }if(a==='reset'){clearInterval(timer);timer=null;remaining=t.duration*60}if(a==='share'){let text='UE CASTELLDEFELS · '+d.date+'\n'+rank(d.tasks).map((p,i)=>`${i+1}. ${name(p.id)} — ${p.pts} pts`).join('\n');window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');return}if(a==='finish'){if(!d.tasks.length)throw Error('Añade tareas.');if(!confirm('¿Guardar este entrenamiento en Supabase?'))return;b.disabled=true;await q(db.from('sessions').upsert({id:d.id,session_date:d.date,title:d.title,status:'completed'}));await q(db.from('attendance').upsert(players.map(p=>({session_id:d.id,player_id:p.id,present:d.present.includes(p.id)}))));for(let [i,x] of d.tasks.entries()){await q(db.from('exercises').upsert({id:x.id,session_id:d.id,name:x.name,duration:x.duration,position:i+1,scoring_type:x.type,win_points:x.win,draw_points:x.draw,loss_points:x.loss,status:'completed'}));for(let y of x.teams){await q(db.from('teams').upsert({id:y.id,exercise_id:x.id,name:y.name,color:y.color,kind:y.kind}));if(y.members.length)await q(db.from('team_players').upsert(y.members.map(p=>({team_id:y.id,player_id:p}))))}if(x.events.length)await q(db.from('scoring_events').upsert(x.events))}d=fresh();view='home';msg.textContent='Entrenamiento guardado.'}save();render()}catch(e){b.disabled=false;fail(e)}});window.addEventListener('online',render);window.addEventListener('offline',render);try{let r=await db.auth.getSession();await init(r.data.session?.user)}catch(e){fail(e);if(!user)render()}
</script></html>
