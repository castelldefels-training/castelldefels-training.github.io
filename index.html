async function load(){let s=await q(db.from('sessions').select('id,session_date,title,status,training_meta').eq('status','completed'));history=s.filter(x=>x.training_meta?.tasks).map(x=>x.training_meta);closed=(await q(db.from('training_months').select('month'))).map(x=>x.month);let legacy=s.filter(x=>!x.training_meta?.tasks);for(let x of legacy){let tasks=await q(db.from('exercises').select('*').eq('session_id',x.id));for(let t of tasks){t.teams=await q(db.from('teams').select('*').eq('exercise_id',t.id));t.events=[];for(let z of t.teams){z.members=(await q(db.from('team_players').select('player_id').eq('team_id',z.id))).map(p=>p.player_id);t.events.push(...await q(db.from('scoring_events').select('*').eq('team_id',z.id)))}t.done=true}history.push({id:x.id,date:x.session_date,title:x.title,tasks,injured:[],manual:{}})}}async function init(u){user=u;if(!u){render();return}players=await q(db.from('players').select('id,full_name,active').eq('active',true).order('full_name'));selected=players[0]?.id;try{d=JSON.parse(localStorage.getItem(key()))||fresh()}catch{d=fresh()}d.injured??=[];d.manual??={};d.reasons??={};await load();if(history.some(x=>x.id===d.id)&&!d.editing){d=fresh();localSave()}try{await pullDraft(true)}catch(e){conflict=true;syncError=e.message}render();statusSync()}app.addEventListener('submit',async e=>{e.preventDefault();try{let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await init(r.data.user)}catch(e){$('msg').textContent=e.message}});app.addEventListener('change',e=>{let a=e.target,t=d.tasks[d.current];if(!a.dataset.status&&!a.dataset.team&&!a.dataset.teamcolor&&!['taskmode','teamcount','date','title','period','month','selected','metric'].includes(a.id))return;if(a.dataset.status){if(d.tasks.some(t=>t.events.length||t.done)){alert('No cambies asistencia después de registrar resultados.');render();return}let id=a.dataset.status;d.present=d.present.filter(x=>x!==id);d.injured=d.in async function imageRank(){let r=rows(),c=document.createElement('canvas');c.width=1000;c.height=230+r.length*54;let g=c.getContext('2d');g.fillStyle='#10213d';g.fillRect(0,0,c.width,c.height);g.fillStyle='#ffd426';g.font='bold 42px sans-serif';g.fillText('UE CASTELLDEFELS · TRAINING LEAGUE',35,65);g.font='26px sans-serif';g.fillText(period==='month'?month:period==='season'?'TEMPORADA':'SESIÓN',35,110);g.font='bold 24px sans-serif';g.fillText('POS     JUGADOR',35,160);g.fillText('VIC     GOL     PTS',670,160);r.forEach((p,i)=>{let y=175+i*54;g.fillStyle=!r.some(z=>z.pts>0)?'#263d61':i===0?'#b38b25':i<=Math.floor((r.length-1)/2)?'#194a35':'#722d39';g.fillRect(25,y,950,50);if(i===0&&r[0].pts>0){g.strokeStyle='#ffd426';g.lineWidth=3;g.strokeRect(26,y+1,948,48)}g.fillStyle='white';g.font='25px sans-serif';g.fillText(i===0&&r[0].pts>0?'👑 1':i+1,42,y+34);g.fillText(name(p.id).slice(0,38),130,y+34);g.fillText(p.wins,690,y+34);g.fillText(p.goals,790,y+34);g.fillStyle='#ffd426';g.fillText(p.pts,910,y+34)});g.font='22px sans-serif';g.fillText('Rey: dorado · Mitad superior: verde · Mitad inferior: rojo',35,c.height-20);let blob=await new Promise(r=>c.toBlob(r));let file=new File([blob],'training-league.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}
app.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b||busy)return;let [a,id,typ,val]=b.dataset.act.split(':'),t=d?.tasks[d.current];$('msg').textContent='';try{if(['home','live','rank','player','history'].includes(a)){if(a==='player'&&period==='session')period='month';view=a;render();statusSync();return}if(a==='logout'){stop();await db.auth.signOut();user=null;render();return}if(a==='sync'){await pullDraft();render();statusSync();return}if(a==='refresh'){await load()}if(a==='editSession'){let x=history.find(z=>z.id===id);if(!x||!x.present||closed.includes(x.date.slice(0,7)))throw Error('Sesión no editable.');if(d.tasks.length&&!confirm('¿Sustituir el borrador local por esta sesión?'))return;stop();d=structuredClone(x);d.editing=true;d.current=0;view='home'}if(a==='cancelEdit'){if(!confirm('¿Descartar cambios sin modificar la sesión guardada?'))return;stop();d=fresh();view='history'}if(a==='reopen'){if(confirm('¿Reabrir tarea para corregir resultados?')){d.tasks[Number(id)].done=false;d.current=Number(id);view='live'}}if(a==='deleteSession'){let x=history.find(z=>z.id===id);if(!x||closed.includes(x.date.slice(0,7)))throw Error('Sesión no disponible o mes cerrado.');if(!confirm('¿Eliminar definitivamente el entrenamiento del '+x.date+' y todos sus puntos?'))return;busy=true;b.disabled=true;let deleted=await q(db.from('sessions').delete().eq('id',id).select('id'));if(deleted.length!==1)throw Error('No se ha eliminado la sesión. Comprueba los permisos.');if(d.id===id){stop();d=fresh()}await load();$('msg').textContent='Entrenamiento eliminado.'}if(a==='old'){month=id;period='month';view='rank'}if(a==='add'){let n=$('taskname').value.trim(),m=Number($('duration').value);if(!n||!Number.isInteger(m)||m<1)throw Error('Indica nombre y duración.');stop();d.tasks.push({id:uid(),name:n,duration:m,remaining:m*60,type:'collective',mode:'classic',teamCount:3,teams:[],events:[],done:false});d.current=d.tasks.length-1;view='live'}if(a==='task'){stop();d.current=Number(id);view='live'}if(a==='editTask'){let x=d.tasks[id],n=prompt('Nombre',x.name);if(n?.trim()){let m=Number(prompt('Minutos',x.duration));if(m>0&&Number.isInteger(m)){x.name=n.trim();x.duration=m;x.remaining=m*60}}}if(a==='delTask'&&confirm('¿Eliminar tarea y sus resultados?')){stop();d.tasks.splice(Number(id),1);d.current=0}if(a==='team'){if(t.events.length)throw Error('No cambies equipos con resultados registrados.');if(t.mode==='reduced'&&$('kind').value==='team'&&t.teams.filter(x=>x.kind==='team').length>=(t.teamCount||3))throw Error('Este reducido tiene un máximo de '+(t.teamCount||3)+' equipos.');let color=$('color').value,kind=$('kind').value;t.teams.push({id:uid(),name:$('teamname').value.trim()||color,color,kind,members:kind==='team'&&t.teams.some(x=>x.kind==='team')?available(t):[]})}if(a==='editTeam'){let x=t.teams.find(x=>x.id===id),n=prompt('Nombre',x.name);if(n?.trim())x.name=n.trim()}if(a==='delTeam'&&confirm('¿Eliminar equipo y sus acciones?')){t.teams=t.teams.filter(x=>x.id!==id);t.events=t.events.filter(x=>x.team_id!==id)}if(a==='random'||a==='reuse'){if(t.events.length)throw Error('Ya hay resultados.');if(a==='reuse'){let prev=d.tasks[d.current-1];if(!prev)throw Error('No hay tarea anterior.');t.teams=prev.teams.map(x=>({...x,id:uid(),members:x.members.filter(p=>d.present.includes(p)&&!d.injured.includes(p))}))}else{let ts=t.teams.filter(x=>x.kind==='team');if(ts.length<2)throw Error('Crea dos equipos.');t.teams.forEach(x=>x.members=[]);let p=[...d.present].filter(x=>!d.injured.includes(x));for(let i=p.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}p.forEach((x,i)=>ts[i%ts.length].members.push(x))}}if(a==='subtract'){let idx=[...t.events].reverse().findIndex(e=>e.team_id===id&&e.event_type===typ);if(idx>=0)t.events.splice(t.events.length-1-idx,1)}if(a==='goal'||a==='event')t.events.push({id:uid(),team_id:id,player_id:a==='goal'?typ:null,event_type:a==='goal'?'goal':typ,value:Number(val),created_at:new Date().toISOString()});if(a==='undo')t.events.pop();if(a==='timer'){if(timer)stop();else{t.remaining??=t.duration*60;if(!t.remaining)t.remaining=t.duration*60;timer=setInterval(()=>{t.remaining=Math.max(0,t.remaining-1);if($('clock'))$('clock').textContent=clock(t);localSave();if(!t.remaining){stop();save()}},1000)}}if(a==='reset'){stop();t.remaining=t.duration*60}if(a==='done'){if(t.mode==='reduced'&&t.teams.filter(x=>x.kind==='team').length!==(t.teamCount||3))throw Error('Crea '+(t.teamCount||3)+' equipos para este reducido.');if(t.teams.filter(x=>x.kind==='team'&&x.members.length).length<2)throw Error('Necesitas dos equipos con jugadores.');if(confirm('¿Finalizar tarea y calcular puntos?')){stop();t.done=true;view='home'}}if(a==='directManual'){let id=$('directPlayer').value,p=Number($('directPoints').value),date=$('directDate').value,reason=$('directReason').value.trim();if(!players.some(x=>x.id===id)||!Number.isSafeInteger(p)||p<=0||!date||date>today()||!reason)throw Error('Indica jugador, fecha válida, puntos enteros positivos y motivo.');if(closed.includes(date.slice(0,7)))throw Error('Mes cerrado.');if(!confirm('¿Sumar '+p+' puntos a '+name(id)+'?'))return;busy=true;b.disabled=true;let entry={id:uid(),date,title:'Ajuste manual · '+name(id)+' · '+reason,tasks:[],injured:[],manual:{[id]:p},reasons:{[id]:[{points:p,reason,by:user.id,at:new Date().toISOString()}]},adjustment:true};await q(db.from('sessions').insert({id:entry.id,session_date:date,title:entry.title,status:'completed',training_meta:entry}));await load();month=date.slice(0,7);render();statusSync();return}if(a==='manual'){let p=Number($('manualPoints').value),id=$('manualPlayer').value,reason=$('reason').value.trim();if(!Number.isInteger(p)||p<0||!reason)throw Error('Indica puntos enteros y motivo.');d.manual[id]=(d.manual[id]||0)+p;d.reasons??={};(d.reasons[id]??=[]).push({points:p,reason,by:user.id,at:new Date().toISOString()})}if(a==='clearManual'){delete d.manual[id];delete d.reasons?.[id]}if(a==='share'){window.open('https://wa.me/?text='+encodeURIComponent('UE CASTELLDEFELS · '+month+'\n'+rows().map((p,i)=>`${!rows().some(z=>z.pts>0)?'':i===0?'👑 ':i<=Math.floor((rows().length-1)/2)?'🟢 ':'🔴 '}${i+1}. ${name(p.id)} — ${p.pts} pts`).join('\n')),'_blank');return}if(a==='image'){await imageRank();return}if(a==='closeMonth'){if(!confirm('¿Cerrar '+month+'? No se podrán guardar nuevas sesiones de ese mes.'))return;await q(db.from('training_months').insert({month,closed_by:user.id}));await load()}if(a==='finish'){if(!d.tasks.length||d.tasks.length%2||d.tasks.some(x=>!x.done))throw Error('Finaliza todas las tareas y asegúrate de que sean un número par.');if(closed.includes(d.date.slice(0,7)))throw Error('Mes cerrado.');if(!confirm(d.editing?'¿Guardar correcciones de esta sesión?':'¿Guardar sesión definitiva?'))return;busy=true;b.disabled=true;await queue;if(conflict&&!d.editing)throw Error('Resuelve la sincronización antes de finalizar.');await q(db.from('sessions').upsert({id:d.id,session_date:d.date,title:d.title,status:'completed',training_meta:Object.fromEntries(Object.entries(d).filter(([k])=>k!=='editing'))}));if(!d.editing)await clearCloud();await load();d=fresh();synced=snapshot();view='rank';period='month';$('msg').textContent='Sesión guardada.'}save();render();statusSync()}catch(e){$('msg').textContent=e.message;b.disabled=false}finally{busy=false}});try{let r=await db.auth.getSession();await init(r.data.session?.user)}catch(e){$('msg').textContent=e.message;render()}
</script></html>
